version = 1
default = "qwen"

# Relative model paths are resolved beneath LLAMA_MODELS_DIR. If that variable
# is unset, llm-serve falls back to ~/Games/Models.

[defaults]
host = "127.0.0.1"
port = 11434

[backends.llama]
threads = "auto"
ctx_size = 8192
batch_size = 1024
ubatch_size = 1024
# Safe fallback for an unknown machine. The desktop profile enables its 4090.
gpu_layers = 0
fit = false

[backends.vllm]
dtype = "auto"
gpu_memory_headroom_mib = 2048

[hosts.desktop.backends.llama]
# The RTX 4090 has 24 GiB. Let llama.cpp offload as much as fits while keeping
# a 2 GiB startup margin for the desktop and CUDA overhead.
gpu_layers = "auto"
fit = true
fit_target_mib = 2048

[hosts.laptop.backends.llama]
gpu_layers = 0
fit = false

[hosts.vm.backends.llama]
gpu_layers = 0
fit = false

[targets.omni]
backend = "llama"
description = "Tesslate OmniCoder 9B Q6_K; general local coding default"
model = "omnicoder-9b-q6_k.gguf"
served_name = "omnicoder-9b"
gpu_expectation = "full"
reasoning_format = "none"
reasoning_budget = 0

[targets.valkyrie]
backend = "llama"
description = "Valkyrie 49B v2j Q6_K; current large general-purpose GGUF"
model = "Valkyrie-49B-v2j-Q6_K.gguf"
served_name = "valkyrie-49b"
gpu_expectation = "partial"
# The previous generic launcher gave every fallback model 64k context and
# rewrote its metadata. Start this large model conservatively; override the
# context explicitly after measuring available RAM/VRAM if a workload needs it.
ctx_size = 8192

[targets.qwen]
backend = "llama"
description = "Qwen3.5 9B Q4_K_M; fast general-purpose default"
# Source: https://huggingface.co/unsloth/Qwen3.5-9B-GGUF
# Downloaded with:
#   hf download unsloth/Qwen3.5-9B-GGUF Qwen3.5-9B-Q4_K_M.gguf --local-dir "$LLAMA_MODELS_DIR"
model = "Qwen3.5-9B-Q4_K_M.gguf"
served_name = "qwen3.5-9b"
gpu_expectation = "full"
# The 5.68 GiB quant fits comfortably on the 24 GiB RTX 4090. Start with a
# useful context that leaves generous room for KV cache and desktop workloads.
ctx_size = 32768
flash_attn = "on"
jinja = true

[targets.qwen25]
backend = "llama"
description = "Qwen 2.5 7B split GGUF with a large context"
model = "qwen2.5-7b-instruct-q6_k-00001-of-00002.gguf"
served_name = "qwen2.5-7b"
gpu_expectation = "full"
ctx_size = 64000
# This model was previously launched with the metadata override. Keep it
# explicit instead of applying the override to every arbitrary GGUF.
override_kv = "llama.context_length=int:64000"

[targets.cydonia]
backend = "llama"
description = "TheDrummer Cydonia 24B v4.3 Q6_K"
model = "TheDrummer_Cydonia-24B-v4.3-Q6_K.gguf"
served_name = "cydonia-24b"
gpu_expectation = "mostly-full"

[targets.weird]
backend = "llama"
description = "WeirdCompound v1.7 24B Q6_K"
model = "WeirdCompound-v1.7-24b.Q6_K.gguf"
served_name = "weirdcompound-24b"
gpu_expectation = "mostly-full"

[targets.oss]
backend = "llama"
description = "gpt-oss 20B Q6_K with its model-specific sampling defaults"
model = "gpt-oss-20b-Q6_K.gguf"
served_name = "gpt-oss-20b"
gpu_expectation = "full"
jinja = true
reasoning_format = "none"
reasoning_budget = 0
flash_attn = "auto"
temperature = 1.0
top_p = 1.0
top_k = 0
min_p = 0.0
repeat_penalty = 1.0
presence_penalty = 0.0
frequency_penalty = 0.0
dry_multiplier = 0.0

[targets.euryale]
backend = "llama"
description = "Llama 3.3 Euryale 70B Q4_K_M; CPU/RAM plus partial 4090 offload"
model = "roleplay/L3.3-70B-Euryale-v2.3-Q4_K_M.gguf"
served_name = "L3.3-70B-Euryale-v2.3"
gpu_expectation = "partial"
ctx_size = 16384
parallel = 1
fit_ctx = 8192
flash_attn = "on"
cache_type_k = "q8_0"
cache_type_v = "q8_0"

[targets.fallen]
backend = "llama"
description = "TheDrummer Fallen Command A 111B v1.1 IQ3_M; RAM-heavy with partial 4090 offload"
# Source: https://huggingface.co/bartowski/TheDrummer_Fallen-Command-A-111B-v1.1-GGUF
# Downloaded with:
#   hf download bartowski/TheDrummer_Fallen-Command-A-111B-v1.1-GGUF \
#     --include "TheDrummer_Fallen-Command-A-111B-v1.1-IQ3_M/*" \
#     --local-dir "$LLAMA_MODELS_DIR"
model = "TheDrummer_Fallen-Command-A-111B-v1.1-IQ3_M/TheDrummer_Fallen-Command-A-111B-v1.1-IQ3_M-00001-of-00002.gguf"
served_name = "fallen-command-a-111b"
gpu_expectation = "partial"
ctx_size = 32768
parallel = 1
fit_ctx = 32768
flash_attn = "on"
cache_type_k = "q8_0"
cache_type_v = "q8_0"
jinja = true

[targets.qwen-vllm]
backend = "vllm"
description = "Qwen3 14B AWQ through vLLM"
model = "Qwen/Qwen3-14B-AWQ"
local_model = "Qwen3-14B-AWQ"
served_name = "qwen3-14b-awq"
gpu_expectation = "full"
max_model_len = 32768
max_num_seqs = 8
reasoning_parser = "qwen3"
enable_qwen_defaults = true
# Expert parallelism is for MoE deployments and should never be inferred only
# from the GPU count. Qwen3-14B is dense, so keep it disabled explicitly.
expert_parallel = false

[targets.embeddings]
backend = "embeddings-cpu"
description = "Qwen3 0.6B CPU embeddings service on port 11435"
model = "Qwen/Qwen3-Embedding-0.6B"
local_model = "Qwen3-Embedding-0.6B"
served_name = "qwen3-embedding-0.6b"
gpu_expectation = "cpu"
port = 11435
dtype = "float32"
max_model_len = 8192
max_num_seqs = 32

[targets.qwen-both]
backend = "command"
description = "Qwen vLLM chat plus the CPU embeddings service"
command = ["vllm-serve-both"]
gpu_expectation = "full+cpu"

[targets.cydonia-exl3]
backend = "command"
description = "Cydonia EXL3 through TabbyAPI"
command = ["tabby-serve"]
gpu_expectation = "full"

[targets.textgen]
backend = "command"
description = "text-generation-webui; choose and configure models in the UI"
command = ["textgen-serve"]
gpu_expectation = "dynamic"
model_env = "TEXTGEN_MODEL"
host_env = "TEXTGEN_HOST"
port_env = "TEXTGEN_PORT"
host = "127.0.0.1"
port = 7860

[targets.tavern]
backend = "command"
description = "Legacy llama.cpp launcher for the newest tavern GGUF"
command = ["tavern-serve"]
gpu_expectation = "dynamic"
